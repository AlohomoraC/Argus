# Scheduled digest on GitHub Actions — no computer needs to stay on.
#
# Setup (in your own fork; a private fork is recommended because state and outputs are your reading history):
#   1. Secrets → ARGUS_CONFIG_JSON: the full contents of your config.json (it holds no secrets; those are ${VARS}).
#      Optional ARGUS_CONTEXT_MD: your project context; it is written to the path in profile.context_file.
#   2. Secrets for your backend: ANTHROPIC_API_KEY (claude-cli) or OPENAI_API_KEY (codex-cli).
#   3. Secrets for delivery, matching the ${VARS} in your config, e.g. FEISHU_WEBHOOK_URL, SLACK_WEBHOOK_URL.
#   4. Enable this workflow. It wakes hourly; `argus.py due` skips all setup unless a job is due.
# State (seen items, tracked topics) persists in the Actions cache.
name: digest
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency: digest

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Write config and context from secrets
        env:
          ARGUS_CONFIG_JSON: ${{ secrets.ARGUS_CONFIG_JSON }}
          ARGUS_CONTEXT_MD: ${{ secrets.ARGUS_CONTEXT_MD }}
        run: |
          if [ -n "$ARGUS_CONFIG_JSON" ]; then printf '%s' "$ARGUS_CONFIG_JSON" > config.json; fi
          [ -f config.json ] || { echo "No config: add the ARGUS_CONFIG_JSON secret or commit config.json"; exit 1; }
          if [ -n "$ARGUS_CONTEXT_MD" ]; then
            ctx=$(python -c "import json;print(json.load(open('config.json'))['profile']['context_file'])")
            mkdir -p "$(dirname "$ctx")" && printf '%s' "$ARGUS_CONTEXT_MD" > "$ctx"
          fi

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: argus-state-${{ github.run_id }}
          restore-keys: argus-state-

      - name: Anything due?
        id: due
        run: python argus.py due && echo "run=true" >> "$GITHUB_OUTPUT" || echo "run=false" >> "$GITHUB_OUTPUT"

      - name: Install the model CLI
        if: steps.due.outputs.run == 'true'
        run: |
          backend=$(python -c "import json;print(json.load(open('config.json')).get('llm',{}).get('backend','claude-cli'))")
          if [ "$backend" = "codex-cli" ]; then
            npm install -g @openai/codex
            printenv OPENAI_API_KEY | codex login --with-api-key
          else
            npm install -g @anthropic-ai/claude-code
          fi

      - name: Run due jobs
        if: steps.due.outputs.run == 'true'
        run: python argus.py tick

      - name: Save state
        if: always() && steps.due.outputs.run == 'true'
        uses: actions/cache/save@v4
        with:
          path: state
          key: argus-state-${{ github.run_id }}

      - name: Upload digests
        if: always() && steps.due.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_id }}
          path: |
            out/*.md
            out/*.html
            logs/
          if-no-files-found: ignore
          retention-days: 14
